<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma Todo List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- En-tête -->
        <header>
            <h1>📝 Ma Todo List</h1>
            <p class="subtitle">Organise tes tâches efficacement</p>
        </header>

        <!-- Formulaire d'ajout -->
        <div class="add-todo-section">
            <input 
                type="text" 
                id="todoInput" 
                placeholder="Ajouter une nouvelle tâche..."
                autocomplete="off"
            >
            <button id="addBtn" class="btn-add">Ajouter</button>
        </div>

        <!-- Liste des todos -->
        <div class="todos-container">
            <ul id="todoList" class="todo-list">
                <!-- Les todos seront ajoutés ici dynamiquement par JavaScript -->
            </ul>
        </div>

        <!-- Message si pas de todos -->
        <div id="emptyState" class="empty-state">
            <p>🎉 Aucune tâche pour le moment !</p>
            <p class="empty-subtitle">Ajoute ta première tâche ci-dessus</p>
        </div>
    </div>

    <!-- Ton fichier JavaScript -->
    <script src="script.js"></script>
</body>
</html>
